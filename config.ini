[OpenAI]
api_type = openai
model = gpt-4o-mini
reasoning_model = gpt-4o-mini
embedding_model = text-embedding-3-large
max_tokens = 20000
temperature = 1.0
freq_penalty = 0.3
presence_penalty = 0.4
timeout = 300
max_attempts = 6
waiting_time = 10
exponential_backoff_factor = 1.5
cache_api_calls = True
cache_file_name = openai_api_cache.pickle
max_content_display_length = 4000

[Simulation]
parallel_agent_generation = False
parallel_agent_actions = False
rai_harmful_content_prevention = True
rai_copyright_infringement_prevention = True

[Cognition]
enable_memory_consolidation = True
min_episode_length = 12
max_episode_length = 45
episodic_memory_fixed_prefix_length = 8
episodic_memory_lookback_length = 20
enable_self_reflection = True
reflection_depth = medium
contextual_continuity = True

[ActionGenerator]
max_attempts = 3
enable_quality_checks = True
enable_regeneration = True
enable_direct_correction = True
continue_on_failure = True
quality_threshold = 6

[Logging]
loglevel = DEBUG
